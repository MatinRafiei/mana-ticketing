<!DOCTYPE html>
<html lang="fa" dir="rtl" class="h-full bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="سامانه تیکتینگ درون‌سازمانی با قابلیت اعلان بلادرنگ و گوگل درایو" />

  <title>سامانه تیکتینگ مانا | سامانه درون‌سازمانی</title>

  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icons/company_logo.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['IRAN Rounded', 'Iran Rounded', 'IRANYekan', 'Vazirmatn', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8'
            }
          }
        }
      }
    };
  </script>

  <!-- Application Stylesheet -->
  <link rel="stylesheet" href="./css/styles.css?v=2.5" />

  <!-- Google Identity Services for Google Drive Integration -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="h-full flex flex-col font-sans antialiased selection:bg-blue-500 selection:text-white">

  <!-- Main Top Navigation Container -->
  <div id="navbar-container"></div>

  <!-- Main View Area (Responsive padding for mobile and bottom navigation) -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-3 sm:py-6 pb-24 md:pb-8">
    <!-- Ticket List View Container -->
    <div id="ticket-list-container"></div>

    <!-- Admin & Roles Management Container -->
    <div id="admin-tab-container" style="display: none;"></div>
  </main>

  <!-- Modals & Drawers Containers -->
  <div id="ticket-modal-container"></div>
  <div id="ticket-detail-container"></div>
  <div id="settings-modal-container"></div>

  <!-- Application Script Module -->
  <script type="module" src="./js/app.js?v=2.5"></script>
</body>
</html>
